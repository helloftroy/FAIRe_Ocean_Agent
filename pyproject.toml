[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-ocean-agent"
version = "0.1.0"
description = "Evidence-backed FAIR ocean eDNA/molecular metadata curation pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<9.0",
    "rich>=13.7,<14.0",
    "python-dateutil>=2.8,<3.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    "pypdf>=4.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]
postgres = [
    "psycopg2-binary>=2.9,<3.0",
]

[project.scripts]
fair-ocean = "fair_ocean_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
