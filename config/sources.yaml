# Source-adapter configuration. crossref/europe_pmc/openalex,
# ncbi_bioproject/ncbi_biosample/ena, and dataset metadata adapters
# (BCO-DMO/PANGAEA/DataCite/OBIS/GBIF) are implemented. Adapters retrieve
# metadata and manifests only -- never large primary data files.
#
# ncbi_bioproject and ncbi_biosample share one rate-limited HTTP client at
# runtime (workflow/handlers.py) since they both hit eutils.ncbi.nlm.nih.gov,
# which enforces its per-IP limit across all eutils calls combined -- the
# rate_limit_per_second below (3, matching NCBI's no-API-key guidance) is
# the one that actually gets enforced for both.
#
# ncbi_sra is deliberately left disabled/unimplemented: run-level SRA data
# (library strategy, platform, file accessions) is served by the `ena`
# adapter's read_run query instead, since ENA mirrors the same INSDC-shared
# records via much cleaner JSON than NCBI's SRA XML. See sources/ncbi.py.
#
# rate_limit_per_second and priority are read by the adapter base class.

sources:
  crossref:
    enabled: true
    base_url: "https://api.crossref.org"
    rate_limit_per_second: 5
    priority: 1

  europe_pmc:
    enabled: true
    base_url: "https://www.ebi.ac.uk/europepmc/webservices/rest"
    rate_limit_per_second: 5
    priority: 2

  openalex:
    enabled: true
    base_url: "https://api.openalex.org"
    rate_limit_per_second: 5
    priority: 3

  ncbi_bioproject:
    enabled: true
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
    rate_limit_per_second: 3
    priority: 4

  ncbi_biosample:
    enabled: true
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
    rate_limit_per_second: 3
    priority: 5

  ncbi_sra:
    enabled: false
    base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
    rate_limit_per_second: 3
    priority: 6

  ena:
    enabled: true
    base_url: "https://www.ebi.ac.uk/ena/portal/api"
    rate_limit_per_second: 5
    priority: 7

  obis:
    enabled: true
    base_url: "https://api.obis.org"
    rate_limit_per_second: 5
    priority: 8

  gbif:
    enabled: true
    base_url: "https://api.gbif.org/v1"
    rate_limit_per_second: 5
    priority: 9

  bcodmo:
    enabled: true
    base_url: "https://www.bco-dmo.org/api"
    rate_limit_per_second: 3
    priority: 10

  pangaea:
    enabled: true
    base_url: "https://doi.pangaea.de"
    rate_limit_per_second: 3
    priority: 11

  datacite:
    enabled: true
    base_url: "https://api.datacite.org"
    rate_limit_per_second: 5
    priority: 12

  # Pass 2 (general-purpose dataset repositories): only queried once
  # BioProject/SRA/ENA accession mining (Pass 1) has found nothing for a
  # study -- see discovery/text_identifiers.py's Pass 2 gating and
  # workflow/handlers.py's _discover_identifiers_from_fulltext.
  zenodo:
    enabled: true
    base_url: "https://zenodo.org/api"
    rate_limit_per_second: 3
    priority: 13

  dryad:
    enabled: true
    base_url: "https://datadryad.org/api/v2"
    rate_limit_per_second: 3
    priority: 14

  figshare:
    enabled: true
    base_url: "https://api.figshare.com/v2"
    rate_limit_per_second: 3
    priority: 15

  osf:
    enabled: true
    base_url: "https://api.osf.io/v2"
    rate_limit_per_second: 3
    priority: 16

  qiita:
    enabled: true
    base_url: "https://qiita.ucsd.edu"
    rate_limit_per_second: 0.5
    priority: 17

# Keyword search terms for later broad discovery (section 7). Not executed
# until discovery.keyword_search_enabled is true and a keyword-search command
# is run explicitly.
discovery_keywords:
  - "marine environmental DNA"
  - "marine eDNA"
  - "ocean metabarcoding"
  - "seawater metabarcoding"
  - "marine 16S"
  - "marine 18S"
  - "marine COI"
  - "marine 12S"
  - "marine metagenomics"
  - "ocean molecular observations"
