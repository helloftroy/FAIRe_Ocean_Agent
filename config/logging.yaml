version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(asctime)s %(levelname)-8s %(name)s :: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"
  json:
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: console
    level: INFO
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  fair_ocean_agent:
    level: INFO
    propagate: true
  sqlalchemy.engine:
    level: WARNING
    propagate: true
