# Candidate open-weight models for the benchmark harness (llm/benchmark.py).
#
# This project does not choose or hard-code a specific model anywhere.
# Every candidate below must point at a real, currently-running
# OpenAI-compatible inference endpoint (Ollama, vLLM, TGI's OpenAI router,
# an institutional gateway, ...) before `fair-ocean benchmark-models` can
# use it -- "OpenAI-compatible" here means only the HTTP request/response
# shape (POST {base_url}/chat/completions); nothing contacts an
# OpenAI-operated host or requires an OpenAI account.
#
# Add as many candidates as you want compared side by side. `label`
# identifies each one in benchmark reports -- make it descriptive
# (e.g. the actual model name/quantization), not generic.

candidates:
  - label: "qwen2.5-3b-ollama"
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:3b"
    api_key_env: "LOCAL_LLM_API_KEY"
    timeout_seconds: 180
    max_concurrency: 1

  - label: "qwen3-4b-instruct-ollama"
    base_url: "http://localhost:11434/v1"
    model: "qwen3:4b-instruct"
    api_key_env: "LOCAL_LLM_API_KEY"
    timeout_seconds: 180
    max_concurrency: 1
    # Known gap, kept here as a reference case: `num_ctx` below is silently
    # ignored by Ollama's OpenAI-compatible endpoint (confirmed live -- this
    # model 400s at ~5,000 prompt tokens with "exceeds the available context
    # size (4096 tokens)" even with num_ctx set here). The only real fix is
    # server-side: a Modelfile with `PARAMETER num_ctx` actually baked in --
    # see the qwen3-4b-instruct-16k entry below for exactly that.
    max_output_tokens: 2048
    num_ctx: 8192

  - label: "qwen3-4b-instruct-16k-ollama"
    base_url: "http://localhost:11434/v1"
    # `ollama create qwen3:4b-instruct-16k` from qwen3:4b-instruct's own
    # Modelfile plus `PARAMETER num_ctx 16384` -- num_ctx is genuinely
    # honored here (confirmed live), unlike the plain qwen3-4b-instruct-ollama
    # entry above.
    model: "qwen3:4b-instruct-16k"
    api_key_env: "LOCAL_LLM_API_KEY"
    timeout_seconds: 180
    max_concurrency: 1
    max_output_tokens: 2048
    num_ctx: 16384

  - label: "gemma3-4b-ollama"
    base_url: "http://localhost:11434/v1"
    model: "gemma3:4b"
    api_key_env: "LOCAL_LLM_API_KEY"
    timeout_seconds: 180
    max_concurrency: 1

  - label: "granite3.3-8b-ollama"
    base_url: "http://localhost:11434/v1"
    model: "granite3.3:8b"
    api_key_env: "LOCAL_LLM_API_KEY"
    timeout_seconds: 180
    max_concurrency: 1
