# Default configuration for fair-ocean-agent.
# Values here can be overridden by environment variables prefixed FAIR_OCEAN_
# (see src/fair_ocean_agent/config.py) or by a local config/local.yaml (gitignored).

database:
  url: "sqlite:///data/fair_ocean.db"

workflow:
  worker_id: "local-worker"
  max_attempts: 3
  task_timeout_seconds: 600
  stale_claim_minutes: 30
  default_batch_size: 25

llm:
  enabled: false
  provider: "mock"
  base_url: "http://localhost:11434/v1"
  model: "REPLACE_WITH_MODEL_NAME"
  api_key_env: "LOCAL_LLM_API_KEY"
  timeout_seconds: 180
  max_retries: 3
  temperature: 0
  # Keep extraction budgets high enough for FAIRe-aware prompts. Smaller
  # environment overrides are clamped upward in config.py because 2500-char
  # chunks and 1024-token outputs dropped real PCR/library facts in live runs
  # -- confirmed live again at 2048 with a smaller cluster model (Qwen3-4B):
  # depth, adapter_forward/reverse, and even primer facts went missing
  # entirely from a single collapsed pass over the full ~3,300-token
  # checklist, the same truncated-response shape as the original 1024 bug.
  extraction_max_chars_per_call: 16000
  max_output_tokens: 4096
  max_concurrency: 1
  # Optional request/context hint for compatible servers. Ollama's
  # OpenAI-compatible endpoint may ignore this; use OLLAMA_CONTEXT_LENGTH or
  # a Modelfile PARAMETER num_ctx for Ollama itself.
  num_ctx:

llm_verifier:
  enabled: false
  provider: "openai_compatible"
  base_url: "http://localhost:11434/v1"
  model: "REPLACE_WITH_VERIFIER_MODEL_NAME"
  api_key_env: "LOCAL_LLM_VERIFIER_API_KEY"
  timeout_seconds: 180
  max_retries: 2
  temperature: 0
  max_output_tokens: 512
  max_concurrency: 1
  num_ctx:

retrieval:
  request_timeout_seconds: 60
  cache_enabled: true
  cache_dir: "data/cache"
  user_agent: "fair-ocean-agent/0.1 (contact: REPLACE_WITH_CONTACT_EMAIL)"

supplements:
  enabled: true
  # Checked against the *already-known* size of each referenced supplement
  # file (from the main article XML) before ever downloading Europe PMC's
  # single all-files-bundled zip -- see SupplementConfig's docstring.
  max_bundle_bytes: 50000000
  max_member_bytes: 10000000
  lightweight_inspection_of_large_assets: false
  # Keep supplementary retrieval deterministic by default. Text/PDF
  # preparation still happens, but model extraction is a later explicit
  # task and can be opted in separately.
  llm_text_extraction_enabled: false
  # The opt-in text task normally waits until the main-paper pass exists,
  # then recomputes missing FAIRe fields before reading supplements.
  require_completed_paper_pass: true

discovery:
  citation_expansion_max_depth: 100
  keyword_search_enabled: false

scheduling:
  weekly_overlap_days: 14
  retry_failed_after_hours: 24
  monthly_unresolved_retry: true
  quarterly_full_rediscovery: true

logging:
  level: "INFO"
  json: false
